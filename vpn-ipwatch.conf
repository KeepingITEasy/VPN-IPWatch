# /etc/vpn-ipwatch.conf - sourced by vpn-ipwatch (bash syntax)

# Where alerts go
EMAIL_TO="you@example.com"
#EMAIL_FROM="vpn-ipwatch@yourhost"

# How to decide you're "on the VPN". Use any combination; all set checks must pass.
# Tip: run `ip -br link` while connected to find the interface name,
# and `curl -s ipinfo.io/org` on and off the VPN to see the org strings.
VPN_INTERFACE="tun0"                 # tun0 (OpenVPN), wg0 (WireGuard), proton0, nordlynx...
VPN_ORG_MATCH=""                     # e.g. "Mullvad|M247|Datacamp|Proton"
ISP_ORG_MATCH="Comcast|AT&T|Xfinity" # your real ISP(s) - seeing these = leak
TRUSTED_IPS=""                       # e.g. a dedicated VPN IP: "203.0.113.10"

# 1 = also email on every IP change while on VPN (server hops, reconnects)
ALERT_ON_ANY_CHANGE=0
