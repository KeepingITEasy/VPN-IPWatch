# /etc/vpn-ipwatch.conf - settings for vpn-ipwatch (bash syntax)
# After editing, test with:  vpn-ipwatch --status
 
# Where alerts are sent
EMAIL_TO="you@example.com"
#EMAIL_FROM="vpn-ipwatch@yourhost"
 
# VPN adapter name. Connect the VPN and run:  ip -br link
#   PIA app: pia (or wgpia0)   OpenVPN: tun0   WireGuard: wg0
#   Leave "" if the VPN runs on your router instead of this machine.
VPN_INTERFACE="pia"
 
# Your real ISP. Disconnect the VPN and run:  curl -s ipinfo.io/org
# If your public IP belongs to this provider, you're leaking.
ISP_ORG_MATCH="Comcast"
 
# Optional: the VPN provider's hosting companies (regex). Leave "" for PIA,
# which rents servers from many hosts and would cause false alerts.
VPN_ORG_MATCH=""
 
# Optional: IPs that always count as "on VPN" (space-separated)
TRUSTED_IPS=""
 
# 1 = also email on every IP change while on the VPN (server hops, reconnects)
ALERT_ON_ANY_CHANGE=0
 
# ---- Auto-fix ----
# Script to run as soon as you're found off the VPN (blank = alerts only).
# It runs as root, must be executable, and must not be writable by other users.
# Start from the example:  sudo cp /usr/local/share/vpn-ipwatch/fix-vpn.example.sh /usr/local/sbin/fix-vpn.sh
# Test it with:            sudo vpn-ipwatch --test-fix
FIX_SCRIPT=""
 
# Seconds before the fix script is stopped
FIX_TIMEOUT=120
 
# Seconds to wait after the fix before checking again
FIX_WAIT=15
 
# While still off the VPN, run the fix again at most this often (seconds)
FIX_RETRY_INTERVAL=300
 
# 1 = also run the fix when there's no internet at all but the VPN adapter looks up
FIX_WHEN_OFFLINE=0
 
# ---- Kill switch ----
# Docker containers to pause while off the VPN or offline, space-separated.
# They're unpaused once you're back on the VPN. Only containers vpn-ipwatch
# paused are unpaused. List names with:  docker ps --format '{{.Names}}'
KILL_SWITCH_CONTAINERS=""
